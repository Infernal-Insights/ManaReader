name: mana_reader
description: A cross-platform manga and comic reader.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.1.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database (drift)
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24

  # Archive / CBZ
  archive: ^3.3.7

  # PDF rendering
  pdfrx: ^1.0.77

  # File picking
  file_selector: ^1.0.3

  # Permissions
  permission_handler: ^12.0.1

  # Paths & storage
  path_provider: ^2.1.1
  path: ^1.9.0

  # Crypto (content hashing)
  crypto: ^3.0.3

  # Google Drive / OAuth
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # HTTP
  http: ^1.1.0

  # XML parsing (ComicInfo.xml)
  xml: ^6.5.0

  # Localizations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Legacy (retained for existing screens / tests)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.0.1
  native_pdf_renderer: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.2
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
